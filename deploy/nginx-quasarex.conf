# /etc/nginx/sites-available/quasarex
# Блок HTTPS дописывает certbot автоматически (см. DEPLOY.md).

server {
    listen 80;
    listen [::]:80;
    server_name quasarex.ch www.quasarex.ch;

    # Certbot подставит сюда редирект на HTTPS после выпуска сертификата
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Фото верификации приходят base64 — нужен запас по размеру тела запроса
        client_max_body_size 25m;
    }

    # Заголовки безопасности
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    # Камера нужна для верификации, разрешаем только своему origin
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
}
